<!DOCTYPE html>

<html class="dark" lang="tr"><head>
<meta charset="utf-8"/>
<meta content="width=device-width, initial-scale=1.0" name="viewport"/>
<title>SES LABORATUVARI - Ana Kayıt Arayüzü</title>
<script src="https://cdn.tailwindcss.com?plugins=forms,container-queries"></script>
<link href="https://fonts.googleapis.com/css2?family=Space+Grotesk:wght@300;400;500;600;700&amp;family=Inter:wght@300;400;500;600&amp;display=swap" rel="stylesheet"/>
<link href="https://fonts.googleapis.com/css2?family=Material+Symbols+Outlined:wght,FILL@100..700,0..1&amp;display=swap" rel="stylesheet"/>
<link href="https://fonts.googleapis.com/css2?family=Material+Symbols+Outlined:wght,FILL@100..700,0..1&amp;display=swap" rel="stylesheet"/>
<script id="tailwind-config">
        tailwind.config = {
            darkMode: "class",
            theme: {
                extend: {
                    colors: {
                        "on-error-container": "#ffdad6",
                        "outline": "#869585",
                        "on-secondary-fixed-variant": "#2f2ebe",
                        "on-tertiary-fixed-variant": "#7f2a21",
                        "on-primary-container": "#004b1e",
                        "on-tertiary": "#60130d",
                        "surface-container-highest": "#353534",
                        "secondary-fixed-dim": "#c0c1ff",
                        "on-secondary-fixed": "#07006c",
                        "on-primary-fixed-variant": "#005321",
                        "inverse-on-surface": "#313030",
                        "secondary-fixed": "#e1e0ff",
                        "on-background": "#e5e2e1",
                        "surface-container-lowest": "#0e0e0e",
                        "primary-container": "#22c55e",
                        "surface-container-high": "#2a2a2a",
                        "secondary-container": "#3131c0",
                        "on-primary-fixed": "#002109",
                        "tertiary-fixed-dim": "#ffb4a9",
                        "surface-variant": "#353534",
                        "surface-container-low": "#1c1b1b",
                        "inverse-surface": "#e5e2e1",
                        "secondary": "#c0c1ff",
                        "on-secondary-container": "#b0b2ff",
                        "on-surface": "#e5e2e1",
                        "tertiary": "#ffb5ab",
                        "outline-variant": "#3d4a3d",
                        "on-surface-variant": "#bccbb9",
                        "inverse-primary": "#006e2f",
                        "surface-dim": "#131313",
                        "tertiary-container": "#ff8b7c",
                        "surface": "#131313",
                        "on-secondary": "#1000a9",
                        "surface-tint": "#4ae176",
                        "tertiary-fixed": "#ffdad5",
                        "on-error": "#690005",
                        "primary-fixed": "#6bff8f",
                        "primary": "#4be277",
                        "surface-bright": "#3a3939",
                        "on-tertiary-fixed": "#410001",
                        "error-container": "#93000a",
                        "on-primary": "#003915",
                        "on-tertiary-container": "#76231b",
                        "primary-fixed-dim": "#4ae176",
                        "background": "#131313",
                        "surface-container": "#201f1f",
                        "error": "#ffb4ab"
                    },
                    fontFamily: {
                        "headline": ["Space Grotesk"],
                        "body": ["Inter"],
                        "label": ["Space Grotesk"]
                    },
                    borderRadius: {"DEFAULT": "0.125rem", "lg": "0.25rem", "xl": "0.5rem", "full": "0.75rem"},
                },
            },
        }
    </script>
<style>
        .material-symbols-outlined {
            font-variation-settings: 'FILL' 0, 'wght' 400, 'GRAD' 0, 'opsz' 24;
        }
        .recording-pulse {
            box-shadow: 0 0 0 0 rgba(75, 226, 119, 0.4);
            animation: pulse 2s infinite;
        }
        @keyframes pulse {
            0% { transform: scale(0.95); box-shadow: 0 0 0 0 rgba(75, 226, 119, 0.7); }
            70% { transform: scale(1); box-shadow: 0 0 0 20px rgba(75, 226, 119, 0); }
            100% { transform: scale(0.95); box-shadow: 0 0 0 0 rgba(75, 226, 119, 0); }
        }
        .waveform-bar {
            transition: height 0.1s ease;
        }
    </style>
</head>
<body class="bg-background text-on-background font-body selection:bg-primary/30 min-h-screen flex flex-col overflow-hidden">
<!-- TopAppBar Section -->
<header class="bg-[#1C1B1B] flex justify-between items-center w-full px-6 h-16 fixed top-0 z-50">
<div class="flex items-center gap-3">
<span class="material-symbols-outlined text-primary" data-icon="mic_external_on">mic_external_on</span>
<h1 class="font-['Space_Grotesk'] text-[#fafafa] uppercase tracking-widest text-xl font-bold">SES LABORATUVARI</h1>
</div>
<div class="flex items-center gap-4">
<button class="text-[#BCCBB9] hover:text-[#22c55e] transition-colors scale-95 duration-150">
<span class="material-symbols-outlined" data-icon="settings">settings</span>
</button>
<button class="text-[#BCCBB9] hover:text-[#22c55e] transition-colors scale-95 duration-150">
<span class="material-symbols-outlined" data-icon="mic_external_on">mic_external_on</span>
</button>
</div>
</header>
<!-- Main Content Canvas -->
<main class="flex-1 mt-16 pb-20 flex flex-col items-center justify-between p-8 relative">
<!-- Status Indicator -->
<div class="w-full max-w-4xl flex justify-between items-start pt-10">
<div class="flex flex-col gap-1">
<span class="font-label text-[10px] text-on-surface-variant uppercase tracking-widest">Mikrofon Durumu</span>
<div class="flex items-center gap-2">
<div class="w-2 h-2 rounded-full bg-primary shadow-[0_0_10px_rgba(75,226,119,0.5)]"></div>
<span class="text-on-surface font-medium">AKTİF</span>
</div>
</div>
<div class="flex flex-col items-end gap-1 text-right">
<span class="font-label text-[10px] text-on-surface-variant uppercase tracking-widest">Sinyal Gücü</span>
<div class="flex gap-0.5 h-4 items-end">
<div class="w-1 h-1 bg-primary rounded-full"></div>
<div class="w-1 h-2 bg-primary rounded-full"></div>
<div class="w-1 h-3 bg-primary rounded-full"></div>
<div class="w-1 h-4 bg-primary rounded-full"></div>
<div class="w-1 h-2 bg-surface-variant rounded-full"></div>
</div>
</div>
</div>
<!-- Timer Display (Editorial Display Typography) -->
<div class="flex flex-col items-center justify-center space-y-2">
<span class="font-label text-on-surface-variant uppercase tracking-[0.3em] text-xs">Kayıt Süresi</span>
<h2 class="font-headline text-8xl md:text-[9rem] font-bold tracking-tighter text-[#fafafa] tabular-nums">
                00:42:12
            </h2>
</div>
<!-- Waveform Visualizer (Intentional Asymmetry & Depth) -->
<div class="w-full max-w-5xl h-48 bg-surface-container-lowest rounded-none flex items-center justify-center gap-1.5 px-8 relative overflow-hidden group">
<!-- Simulated Waveform Bars -->
<div class="waveform-bar w-1.5 h-12 bg-surface-variant rounded-full"></div>
<div class="waveform-bar w-1.5 h-24 bg-surface-variant rounded-full"></div>
<div class="waveform-bar w-1.5 h-16 bg-surface-variant rounded-full"></div>
<div class="waveform-bar w-1.5 h-32 bg-primary rounded-full"></div>
<div class="waveform-bar w-1.5 h-40 bg-primary rounded-full"></div>
<div class="waveform-bar w-1.5 h-28 bg-primary rounded-full"></div>
<div class="waveform-bar w-1.5 h-36 bg-primary rounded-full"></div>
<div class="waveform-bar w-1.5 h-44 bg-primary rounded-full"></div>
<div class="waveform-bar w-1.5 h-20 bg-primary rounded-full"></div>
<div class="waveform-bar w-1.5 h-12 bg-surface-variant rounded-full"></div>
<div class="waveform-bar w-1.5 h-18 bg-surface-variant rounded-full"></div>
<div class="waveform-bar w-1.5 h-8 bg-surface-variant rounded-full"></div>
<div class="waveform-bar w-1.5 h-32 bg-primary rounded-full"></div>
<div class="waveform-bar w-1.5 h-24 bg-primary rounded-full"></div>
<div class="waveform-bar w-1.5 h-40 bg-primary rounded-full"></div>
<div class="waveform-bar w-1.5 h-16 bg-surface-variant rounded-full"></div>
<!-- Center Line -->
<div class="absolute left-1/2 top-0 bottom-0 w-px bg-primary/30 z-10"></div>
</div>
<!-- Controls Cluster -->
<div class="flex flex-col items-center gap-12 w-full pb-10">
<!-- Playback Controls (Glassmorphism) -->
<div class="flex items-center gap-8 bg-surface-container-highest/60 backdrop-blur-xl px-10 py-5 rounded-full shadow-2xl border border-outline-variant/10">
<button class="text-on-surface-variant hover:text-secondary transition-all active:scale-90">
<span class="material-symbols-outlined text-3xl" data-icon="skip_previous">skip_previous</span>
</button>
<button class="bg-secondary text-on-secondary w-14 h-14 rounded-full flex items-center justify-center hover:bg-secondary-fixed transition-all active:scale-95 shadow-lg shadow-secondary/20">
<span class="material-symbols-outlined text-3xl" data-icon="play_arrow" style="font-variation-settings: 'FILL' 1;">play_arrow</span>
</button>
<button class="text-on-surface-variant hover:text-secondary transition-all active:scale-90">
<span class="material-symbols-outlined text-3xl" data-icon="skip_next">skip_next</span>
</button>
</div>
<!-- Primary Action: Pulse Record Button -->
<div class="relative group cursor-pointer">
<div class="absolute inset-0 bg-primary/20 rounded-full blur-2xl group-hover:bg-primary/30 transition-all"></div>
<button class="relative w-28 h-28 bg-error-container hover:bg-error transition-all rounded-full flex flex-col items-center justify-center gap-1 border-4 border-background recording-pulse shadow-2xl">
<span class="material-symbols-outlined text-white text-4xl" data-icon="stop" style="font-variation-settings: 'FILL' 1;">stop</span>
<span class="font-label text-[10px] text-white font-bold tracking-widest">DURDUR</span>
</button>
</div>
</div>
<!-- Asymmetric Detail View (Bento-lite) -->
<div class="absolute right-8 top-1/2 -translate-y-1/2 hidden xl:flex flex-col gap-4 w-64">
<div class="bg-surface-container-low p-5 rounded-xl border-l-2 border-primary">
<h4 class="font-label text-[10px] text-on-surface-variant uppercase tracking-widest mb-3">Format Bilgisi</h4>
<div class="space-y-2">
<div class="flex justify-between">
<span class="text-xs text-on-surface-variant">Örnekleme</span>
<span class="text-xs font-headline">48 KHZ</span>
</div>
<div class="flex justify-between">
<span class="text-xs text-on-surface-variant">Bit Hızı</span>
<span class="text-xs font-headline">24 BIT</span>
</div>
<div class="flex justify-between">
<span class="text-xs text-on-surface-variant">Kanal</span>
<span class="text-xs font-headline">STEREO</span>
</div>
</div>
</div>
<div class="bg-surface-container-low p-5 rounded-xl">
<h4 class="font-label text-[10px] text-on-surface-variant uppercase tracking-widest mb-3">Cihaz</h4>
<div class="flex items-center gap-3">
<span class="material-symbols-outlined text-on-surface-variant" data-icon="settings_input_component">settings_input_component</span>
<span class="text-xs text-on-surface font-medium truncate">Studio Mic Pro-X</span>
</div>
</div>
</div>
</main>
<!-- BottomNavBar -->
<nav class="bg-[#131313]/60 backdrop-blur-xl flex justify-around items-center h-20 px-4 pb-4 fixed bottom-0 w-full z-50 shadow-[0_-10px_30px_rgba(0,0,0,0.4)]">
<button class="flex flex-col items-center justify-center text-[#BCCBB9] px-4 py-1 hover:text-[#fafafa] transition-all active:scale-90">
<span class="material-symbols-outlined" data-icon="mic">mic</span>
<span class="font-['Space_Grotesk'] text-[10px] font-medium uppercase tracking-widest">Kayıtlar</span>
</button>
<button class="flex flex-col items-center justify-center text-[#22c55e] bg-[#22c55e]/10 rounded-xl px-4 py-1 hover:text-[#fafafa] transition-all active:scale-90">
<span class="material-symbols-outlined" data-icon="add_circle" style="font-variation-settings: 'FILL' 1;">add_circle</span>
<span class="font-['Space_Grotesk'] text-[10px] font-medium uppercase tracking-widest">Yeni Kayıt</span>
</button>
<button class="flex flex-col items-center justify-center text-[#BCCBB9] px-4 py-1 hover:text-[#fafafa] transition-all active:scale-90">
<span class="material-symbols-outlined" data-icon="library_music">library_music</span>
<span class="font-['Space_Grotesk'] text-[10px] font-medium uppercase tracking-widest">Kitaplık</span>
</button>
<button class="flex flex-col items-center justify-center text-[#BCCBB9] px-4 py-1 hover:text-[#fafafa] transition-all active:scale-90">
<span class="material-symbols-outlined" data-icon="person">person</span>
<span class="font-['Space_Grotesk'] text-[10px] font-medium uppercase tracking-widest">Profil</span>
</button>
</nav>
<!-- Background Decoration -->
<div class="fixed inset-0 pointer-events-none -z-10 overflow-hidden">
<div class="absolute top-[-10%] left-[-10%] w-[40%] h-[40%] bg-primary/5 blur-[120px] rounded-full"></div>
<div class="absolute bottom-[-10%] right-[-10%] w-[40%] h-[40%] bg-secondary/5 blur-[120px] rounded-full"></div>
</div>
</body></html>
