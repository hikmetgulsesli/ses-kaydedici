<!DOCTYPE html>

<html class="dark" lang="tr"><head>
<meta charset="utf-8"/>
<meta content="width=device-width, initial-scale=1.0" name="viewport"/>
<script src="https://cdn.tailwindcss.com?plugins=forms,container-queries"></script>
<link href="https://fonts.googleapis.com/css2?family=Space+Grotesk:wght@300;400;500;600;700&amp;family=Inter:wght@300;400;500;600&amp;display=swap" rel="stylesheet"/>
<link href="https://fonts.googleapis.com/css2?family=Material+Symbols+Outlined:wght,FILL@100..700,0..1&amp;display=swap" rel="stylesheet"/>
<link href="https://fonts.googleapis.com/css2?family=Material+Symbols+Outlined:wght,FILL@100..700,0..1&amp;display=swap" rel="stylesheet"/>
<script id="tailwind-config">
      tailwind.config = {
        darkMode: "class",
        theme: {
          extend: {
            colors: {
              "on-secondary-fixed": "#07006c",
              "primary-container": "#22c55e",
              "tertiary-fixed": "#ffdad5",
              "on-surface-variant": "#bccbb9",
              "surface-container-lowest": "#0e0e0e",
              "secondary-fixed-dim": "#c0c1ff",
              "inverse-on-surface": "#313030",
              "background": "#131313",
              "surface": "#131313",
              "on-tertiary": "#60130d",
              "inverse-surface": "#e5e2e1",
              "error": "#ffb4ab",
              "on-secondary-fixed-variant": "#2f2ebe",
              "on-primary-fixed-variant": "#005321",
              "primary-fixed": "#6bff8f",
              "surface-bright": "#3a3939",
              "primary-fixed-dim": "#4ae176",
              "on-tertiary-container": "#76231b",
              "surface-container": "#201f1f",
              "on-tertiary-fixed-variant": "#7f2a21",
              "tertiary-fixed-dim": "#ffb4a9",
              "inverse-primary": "#006e2f",
              "surface-container-high": "#2a2a2a",
              "on-surface": "#e5e2e1",
              "outline-variant": "#3d4a3d",
              "primary": "#4be277",
              "on-tertiary-fixed": "#410001",
              "secondary-container": "#3131c0",
              "on-primary-fixed": "#002109",
              "on-primary-container": "#004b1e",
              "surface-tint": "#4ae176",
              "on-primary": "#003915",
              "outline": "#869585",
              "tertiary": "#ffb5ab",
              "secondary": "#c0c1ff",
              "on-error": "#690005",
              "on-background": "#e5e2e1",
              "surface-container-low": "#1c1b1b",
              "on-error-container": "#ffdad6",
              "tertiary-container": "#ff8b7c",
              "on-secondary": "#1000a9",
              "surface-dim": "#131313",
              "error-container": "#93000a",
              "on-secondary-container": "#b0b2ff",
              "surface-variant": "#353534",
              "surface-container-highest": "#353534",
              "secondary-fixed": "#e1e0ff"
            },
            fontFamily: {
              "headline": ["Space Grotesk"],
              "body": ["Inter"],
              "label": ["Space Grotesk"]
            },
            borderRadius: {"DEFAULT": "0.125rem", "lg": "0.25rem", "xl": "0.5rem", "full": "0.75rem"},
          },
        },
      }
    </script>
<style>
        .material-symbols-outlined {
            font-variation-settings: 'FILL' 0, 'wght' 300, 'GRAD' 0, 'opsz' 24;
        }
        .mic-shadow {
            box-shadow: 0 0 80px 0 rgba(34, 197, 94, 0.05);
        }
        .editorial-gradient {
            background: linear-gradient(180deg, rgba(28, 27, 27, 0) 0%, rgba(28, 27, 27, 1) 100%);
        }
    </style>
</head>
<body class="bg-background text-on-surface font-body selection:bg-primary-container selection:text-on-primary-container min-h-screen flex flex-col">
<!-- TopAppBar -->
<nav class="fixed top-0 w-full z-50 bg-[#131313] flex justify-between items-center px-6 h-16 w-full">
<div class="text-xl font-bold text-[#fafafa] tracking-tighter font-headline">
            Sonic Lab
        </div>
<div class="flex items-center gap-4">
<button class="text-[#bccbb9] hover:text-[#4be277] transition-colors Active: opacity-80 transition-opacity">
<span class="material-symbols-outlined">settings</span>
</button>
</div>
</nav>
<!-- Main Content Canvas -->
<main class="flex-grow flex flex-col items-center justify-center px-6 pt-16 pb-24 relative overflow-hidden">
<!-- Background Aesthetic Elements (Intentional Asymmetry) -->
<div class="absolute top-1/4 -right-20 w-96 h-96 bg-primary/5 rounded-full blur-[120px]"></div>
<div class="absolute bottom-1/4 -left-20 w-64 h-64 bg-secondary/5 rounded-full blur-[100px]"></div>
<!-- Empty State Container -->
<div class="relative z-10 flex flex-col items-center max-w-md text-center">
<!-- Stylized Microphone Icon -->
<div class="mb-12 relative">
<div class="w-48 h-48 rounded-full bg-surface-container-low flex items-center justify-center mic-shadow border border-outline-variant/10">
<span class="material-symbols-outlined text-8xl text-on-surface-variant opacity-40" style="font-variation-settings: 'wght' 100;">mic</span>
</div>
<!-- Subtle UI Accent -->
<div class="absolute -bottom-2 -right-2 w-12 h-12 bg-primary-container/10 rounded-full flex items-center justify-center border border-primary/20">
<span class="material-symbols-outlined text-primary text-xl" style="font-variation-settings: 'FILL' 1;">add</span>
</div>
</div>
<!-- Typography Cluster -->
<div class="space-y-4 mb-10">
<h1 class="font-headline text-3xl md:text-4xl font-bold tracking-tight text-[#fafafa]">
                    Henüz Kayıt Yok
                </h1>
<p class="font-body text-on-surface-variant text-base leading-relaxed max-w-[280px] mx-auto">
                    İlk ses kaydınızı yapmak için aşağıdaki butona tıklayın
                </p>
</div>
<!-- Call to Action -->
<button class="group relative px-8 py-4 bg-primary-container hover:bg-primary transition-all duration-300 rounded-xl shadow-[0_20px_40px_rgba(34,197,94,0.2)] active:scale-95">
<div class="flex items-center gap-3">
<span class="material-symbols-outlined text-on-primary-container font-bold">fiber_manual_record</span>
<span class="font-headline font-bold uppercase tracking-widest text-sm text-on-primary-container">Kayıt Yapmaya Başla</span>
</div>
</button>
<!-- Lab Metadata Label (Editorial Element) -->
<div class="mt-16 flex items-center gap-8 opacity-30">
<div class="flex flex-col items-center">
<span class="font-label text-[10px] uppercase tracking-tighter text-on-surface-variant">SİNYAL</span>
<span class="font-headline text-xs font-medium">0.0 DB</span>
</div>
<div class="w-[1px] h-4 bg-outline-variant"></div>
<div class="flex flex-col items-center">
<span class="font-label text-[10px] uppercase tracking-tighter text-on-surface-variant">FORMAT</span>
<span class="font-headline text-xs font-medium">WAV 48KHZ</span>
</div>
</div>
</div>
<!-- Decorative Background Waveform (Silent State) -->
<div class="absolute bottom-32 left-0 w-full px-12 flex justify-between items-end h-12 gap-1 opacity-10">
<div class="flex-1 bg-surface-variant h-2 rounded-full"></div>
<div class="flex-1 bg-surface-variant h-4 rounded-full"></div>
<div class="flex-1 bg-surface-variant h-3 rounded-full"></div>
<div class="flex-1 bg-surface-variant h-6 rounded-full"></div>
<div class="flex-1 bg-surface-variant h-8 rounded-full"></div>
<div class="flex-1 bg-surface-variant h-5 rounded-full"></div>
<div class="flex-1 bg-surface-variant h-3 rounded-full"></div>
<div class="flex-1 bg-surface-variant h-7 rounded-full"></div>
<div class="flex-1 bg-surface-variant h-4 rounded-full"></div>
<div class="flex-1 bg-surface-variant h-2 rounded-full"></div>
<div class="flex-1 bg-surface-variant h-5 rounded-full"></div>
<div class="flex-1 bg-surface-variant h-3 rounded-full"></div>
</div>
</main>
<!-- BottomNavBar -->
<nav class="fixed bottom-0 left-0 w-full z-50 flex justify-around items-center px-4 pb-6 pt-3 bg-[#131313]/60 backdrop-blur-xl shadow-[0_-10px_30px_rgba(0,0,0,0.5)]">
<!-- Kitaplık Tab (Active State Logic: No recordings, so we are in library view) -->
<a class="flex flex-col items-center justify-center text-[#22c55e] bg-[#22c55e]/10 rounded-xl px-4 py-1 Active: scale-95 transition-transform duration-200" href="#">
<span class="material-symbols-outlined" style="font-variation-settings: 'FILL' 1;">library_music</span>
<span class="font-['Space_Grotesk'] text-[10px] font-medium uppercase tracking-widest mt-1">Kitaplık</span>
</a>
<!-- Kaydet Tab -->
<a class="flex flex-col items-center justify-center text-[#bccbb9] opacity-60 hover:opacity-100 transition-all Active: scale-95 transition-transform duration-200" href="#">
<span class="material-symbols-outlined">mic</span>
<span class="font-['Space_Grotesk'] text-[10px] font-medium uppercase tracking-widest mt-1">Kaydet</span>
</a>
<!-- Ayarlar Tab -->
<a class="flex flex-col items-center justify-center text-[#bccbb9] opacity-60 hover:opacity-100 transition-all Active: scale-95 transition-transform duration-200" href="#">
<span class="material-symbols-outlined">settings</span>
<span class="font-['Space_Grotesk'] text-[10px] font-medium uppercase tracking-widest mt-1">Ayarlar</span>
</a>
</nav>
</body></html>
