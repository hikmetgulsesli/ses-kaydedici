<!DOCTYPE html>

<html class="dark" lang="tr"><head>
<meta charset="utf-8"/>
<meta content="width=device-width, initial-scale=1.0" name="viewport"/>
<link href="https://fonts.googleapis.com/css2?family=Space+Grotesk:wght@300;400;500;600;700&amp;family=Inter:wght@300;400;500;600&amp;display=swap" rel="stylesheet"/>
<link href="https://fonts.googleapis.com/css2?family=Material+Symbols+Outlined:wght,FILL@100..700,0..1&amp;display=swap" rel="stylesheet"/>
<link href="https://fonts.googleapis.com/css2?family=Material+Symbols+Outlined:wght,FILL@100..700,0..1&amp;display=swap" rel="stylesheet"/>
<script src="https://cdn.tailwindcss.com?plugins=forms,container-queries"></script>
<script id="tailwind-config">
      tailwind.config = {
        darkMode: "class",
        theme: {
          extend: {
            colors: {
              "secondary-container": "#3131c0",
              "tertiary-container": "#ff8b7c",
              "on-secondary": "#1000a9",
              "inverse-surface": "#e5e2e1",
              "on-error-container": "#ffdad6",
              "primary-fixed": "#6bff8f",
              "on-secondary-fixed": "#07006c",
              "surface-bright": "#3a3939",
              "primary-fixed-dim": "#4ae176",
              "on-background": "#e5e2e1",
              "on-tertiary-fixed": "#410001",
              "on-secondary-container": "#b0b2ff",
              "on-tertiary-fixed-variant": "#7f2a21",
              "on-primary-container": "#004b1e",
              "outline": "#869585",
              "tertiary-fixed": "#ffdad5",
              "error": "#ffb4ab",
              "secondary-fixed-dim": "#c0c1ff",
              "surface-container-lowest": "#0e0e0e",
              "on-primary-fixed": "#002109",
              "surface-container-high": "#2a2a2a",
              "primary": "#4be277",
              "on-error": "#690005",
              "on-surface-variant": "#bccbb9",
              "surface-container-low": "#1c1b1b",
              "background": "#131313",
              "on-tertiary-container": "#76231b",
              "on-surface": "#e5e2e1",
              "surface-container-highest": "#353534",
              "tertiary-fixed-dim": "#ffb4a9",
              "surface-dim": "#131313",
              "error-container": "#93000a",
              "tertiary": "#ffb5ab",
              "on-primary": "#003915",
              "secondary": "#c0c1ff",
              "outline-variant": "#3d4a3d",
              "inverse-on-surface": "#313030",
              "on-tertiary": "#60130d",
              "surface": "#131313",
              "surface-container": "#201f1f",
              "secondary-fixed": "#e1e0ff",
              "on-secondary-fixed-variant": "#2f2ebe",
              "inverse-primary": "#006e2f",
              "on-primary-fixed-variant": "#005321",
              "surface-tint": "#4ae176",
              "primary-container": "#22c55e",
              "surface-variant": "#353534"
            },
            fontFamily: {
              "headline": ["Space Grotesk"],
              "body": ["Inter"],
              "label": ["Space Grotesk"]
            },
            borderRadius: {"DEFAULT": "0.125rem", "lg": "0.25rem", "xl": "0.5rem", "full": "0.75rem"},
          },
        },
      }
    </script>
<style>
      .material-symbols-outlined {
        font-variation-settings: 'FILL' 0, 'wght' 400, 'GRAD' 0, 'opsz' 24;
      }
      .waveform-bar {
        transition: height 0.2s ease-in-out;
      }
    </style>
</head>
<body class="bg-background text-on-surface font-body selection:bg-secondary selection:text-on-secondary">
<!-- TopAppBar -->
<header class="bg-[#1C1B1B] sticky top-0 z-50 flex justify-between items-center w-full px-6 py-4">
<div class="flex items-center gap-4">
<button class="text-primary hover:text-[#4BE277] transition-all scale-95 active:opacity-80">
<span class="material-symbols-outlined" data-icon="arrow_back">arrow_back</span>
</button>
<h1 class="font-headline font-bold uppercase tracking-wider text-xs text-on-surface">Vokal Prova 1</h1>
</div>
<div class="flex items-center gap-4">
<button class="text-[#BCCBB9] hover:text-[#4BE277] transition-all scale-95 active:opacity-80">
<span class="material-symbols-outlined" data-icon="settings">settings</span>
</button>
</div>
</header>
<main class="min-h-screen pb-32 pt-6 px-6 max-w-4xl mx-auto flex flex-col gap-10">
<!-- Metadata Header (Editorial Layout) -->
<section class="flex flex-col md:flex-row justify-between items-start md:items-end gap-6">
<div class="space-y-1">
<span class="font-label text-label-sm text-on-surface-variant uppercase tracking-widest">Kayıt Detayları</span>
<h2 class="font-headline text-3xl font-bold text-[#fafafa] tracking-tighter">Vokal Prova 1.wav</h2>
</div>
<div class="flex gap-8">
<div class="flex flex-col">
<span class="font-label text-[10px] text-on-surface-variant uppercase">Dosya Boyutu</span>
<span class="font-headline text-sm font-semibold text-secondary">2.4 MB</span>
</div>
<div class="flex flex-col">
<span class="font-label text-[10px] text-on-surface-variant uppercase">Tarih</span>
<span class="font-headline text-sm font-semibold text-secondary">12 HAZ 2024</span>
</div>
<div class="flex flex-col">
<span class="font-label text-[10px] text-on-surface-variant uppercase">Örnekleme</span>
<span class="font-headline text-sm font-semibold text-secondary">48 KHZ</span>
</div>
</div>
</section>
<!-- Waveform Section (The "Sunken Well") -->
<section class="bg-surface-container-low rounded-xl p-8 min-h-[300px] flex flex-col items-center justify-center relative overflow-hidden group">
<!-- Subtle background texture -->
<div class="absolute inset-0 opacity-10 pointer-events-none" style="background-image: radial-gradient(circle at 2px 2px, #3d4a3d 1px, transparent 0); background-size: 24px 24px;"></div>
<div class="w-full flex items-end justify-center gap-[2px] h-48 mb-8">
<!-- Procedural Waveform Bars -->
<div class="waveform-bar w-1.5 bg-secondary/30 rounded-full h-[20%]"></div>
<div class="waveform-bar w-1.5 bg-secondary/30 rounded-full h-[40%]"></div>
<div class="waveform-bar w-1.5 bg-secondary/30 rounded-full h-[35%]"></div>
<div class="waveform-bar w-1.5 bg-secondary/30 rounded-full h-[60%]"></div>
<div class="waveform-bar w-1.5 bg-secondary/30 rounded-full h-[85%]"></div>
<div class="waveform-bar w-1.5 bg-secondary/30 rounded-full h-[55%]"></div>
<div class="waveform-bar w-1.5 bg-secondary/30 rounded-full h-[70%]"></div>
<div class="waveform-bar w-1.5 bg-secondary rounded-full h-[95%]"></div>
<div class="waveform-bar w-1.5 bg-secondary rounded-full h-[80%]"></div>
<div class="waveform-bar w-1.5 bg-secondary rounded-full h-[60%]"></div>
<div class="waveform-bar w-1.5 bg-secondary rounded-full h-[45%]"></div>
<div class="waveform-bar w-1.5 bg-secondary/30 rounded-full h-[30%]"></div>
<div class="waveform-bar w-1.5 bg-secondary/30 rounded-full h-[50%]"></div>
<div class="waveform-bar w-1.5 bg-secondary/30 rounded-full h-[75%]"></div>
<div class="waveform-bar w-1.5 bg-secondary/30 rounded-full h-[90%]"></div>
<div class="waveform-bar w-1.5 bg-secondary/30 rounded-full h-[40%]"></div>
<div class="waveform-bar w-1.5 bg-secondary/30 rounded-full h-[25%]"></div>
<div class="waveform-bar w-1.5 bg-secondary/30 rounded-full h-[35%]"></div>
<div class="waveform-bar w-1.5 bg-secondary/30 rounded-full h-[15%]"></div>
<div class="waveform-bar w-1.5 bg-secondary/30 rounded-full h-[25%]"></div>
<div class="waveform-bar w-1.5 bg-secondary/30 rounded-full h-[55%]"></div>
<div class="waveform-bar w-1.5 bg-secondary/30 rounded-full h-[40%]"></div>
<div class="waveform-bar w-1.5 bg-secondary/30 rounded-full h-[20%]"></div>
<div class="waveform-bar w-1.5 bg-secondary/30 rounded-full h-[45%]"></div>
<div class="waveform-bar w-1.5 bg-secondary/30 rounded-full h-[65%]"></div>
<div class="waveform-bar w-1.5 bg-secondary/30 rounded-full h-[50%]"></div>
<div class="waveform-bar w-1.5 bg-secondary/30 rounded-full h-[30%]"></div>
</div>
<!-- Timecode -->
<div class="flex flex-col items-center">
<div class="font-headline text-6xl font-medium tracking-tighter text-[#fafafa]">
                    00:02:14<span class="text-secondary/50"> / 03:42</span>
</div>
</div>
</section>
<!-- Playback Controls -->
<section class="space-y-8">
<!-- Seek Bar -->
<div class="relative w-full h-1.5 bg-surface-container-highest rounded-full overflow-hidden">
<div class="absolute top-0 left-0 h-full w-[60%] bg-secondary-container"></div>
<div class="absolute top-1/2 left-[60%] -translate-y-1/2 w-4 h-4 bg-secondary rounded-full shadow-lg border-2 border-background"></div>
</div>
<div class="flex items-center justify-center gap-12">
<button class="text-on-surface-variant hover:text-secondary transition-colors">
<span class="material-symbols-outlined text-3xl" data-icon="fast_rewind">fast_rewind</span>
</button>
<button class="w-20 h-20 rounded-full bg-secondary-container flex items-center justify-center text-on-surface hover:scale-105 transition-all shadow-2xl">
<span class="material-symbols-outlined text-4xl" data-icon="pause" style="font-variation-settings: 'FILL' 1;">pause</span>
</button>
<button class="text-on-surface-variant hover:text-secondary transition-colors">
<span class="material-symbols-outlined text-3xl" data-icon="fast_forward">fast_forward</span>
</button>
</div>
</section>
<!-- Action Grid (Bento Style) -->
<section class="grid grid-cols-1 md:grid-cols-3 gap-4">
<button class="flex items-center justify-center gap-3 bg-surface-container-high hover:bg-surface-container-highest p-4 rounded-xl transition-all group">
<span class="material-symbols-outlined text-secondary group-hover:scale-110 transition-transform" data-icon="download">download</span>
<span class="font-headline text-sm font-medium uppercase tracking-wider">İndir</span>
</button>
<button class="flex items-center justify-center gap-3 bg-surface-container-high hover:bg-surface-container-highest p-4 rounded-xl transition-all group">
<span class="material-symbols-outlined text-secondary group-hover:scale-110 transition-transform" data-icon="share">share</span>
<span class="font-headline text-sm font-medium uppercase tracking-wider">Paylaş</span>
</button>
<button class="flex items-center justify-center gap-3 bg-surface-container-high hover:bg-error-container p-4 rounded-xl transition-all group">
<span class="material-symbols-outlined text-on-surface-variant group-hover:text-error group-hover:scale-110 transition-all" data-icon="delete">delete</span>
<span class="font-headline text-sm font-medium uppercase tracking-wider">Sil</span>
</button>
</section>
</main>
<!-- BottomNavBar -->
<nav class="fixed bottom-0 left-0 w-full z-50 flex justify-around items-center px-4 pb-6 pt-3 bg-[#1C1B1B]/60 backdrop-blur-xl shadow-[0_-10px_40px_rgba(0,0,0,0.4)]">
<a class="flex flex-col items-center justify-center text-[#4BE277] bg-[#22c55e]/10 rounded-xl px-3 py-1 transition-all duration-300 ease-in-out" href="#">
<span class="material-symbols-outlined" data-icon="mic_external_on" style="font-variation-settings: 'FILL' 1;">mic_external_on</span>
<span class="font-space-grotesk text-[10px] font-medium uppercase mt-1">Kayitlar</span>
</a>
<a class="flex flex-col items-center justify-center text-[#BCCBB9] opacity-60 hover:opacity-100 hover:text-[#C0C1FF] transition-all duration-300 ease-in-out" href="#">
<span class="material-symbols-outlined" data-icon="add_circle">add_circle</span>
<span class="font-space-grotesk text-[10px] font-medium uppercase mt-1">Yeni Kayit</span>
</a>
<a class="flex flex-col items-center justify-center text-[#BCCBB9] opacity-60 hover:opacity-100 hover:text-[#C0C1FF] transition-all duration-300 ease-in-out" href="#">
<span class="material-symbols-outlined" data-icon="grade">grade</span>
<span class="font-space-grotesk text-[10px] font-medium uppercase mt-1">Favoriler</span>
</a>
<a class="flex flex-col items-center justify-center text-[#BCCBB9] opacity-60 hover:opacity-100 hover:text-[#C0C1FF] transition-all duration-300 ease-in-out" href="#">
<span class="material-symbols-outlined" data-icon="settings">settings</span>
<span class="font-space-grotesk text-[10px] font-medium uppercase mt-1">Ayarlar</span>
</a>
</nav>
</body></html>
